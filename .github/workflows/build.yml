name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: TransportProblem-win.exe
            pyinstaller_extra: --windowed
          - os: ubuntu-latest
            artifact_name: TransportProblem-linux
            pyinstaller_extra: ""
          - os: macos-latest
            artifact_name: TransportProblem-macos
            pyinstaller_extra: --windowed

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Build executable
      run: |
        pyinstaller --onefile ${{ matrix.pyinstaller_extra }} --name "TransportProblem" main.py

    - name: Rename artifact
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          mv dist/TransportProblem.exe ${{ matrix.artifact_name }}
        elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          mv dist/TransportProblem ${{ matrix.artifact_name }}
        else
          mv dist/TransportProblem ${{ matrix.artifact_name }}
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
